<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapDinosaur</title>
  <meta name="description" content="Mapa interativo dos museus com os fósseis de dinossauro mais incríveis do mundo, com requisitos de visto para brasileiros.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tela de abertura -->
  <div id="intro" aria-hidden="true">
    <div class="intro-tracks">
      <span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span>
    </div>
    <h1 class="intro-title">Map<span>Dinosaur</span></h1>
    <p class="intro-sub">desenterrando os museus mais incríveis do planeta…</p>
  </div>

  <div id="map" role="application" aria-label="Mapa de museus de dinossauros"></div>

  <!-- Painel lateral -->
  <aside id="sidebar" class="glass">
    <header class="brand">
      <div class="brand-logo">🦖</div>
      <div>
        <h1>Map<span>Dinosaur</span></h1>
        <p>Os fósseis mais fodas do mundo</p>
      </div>
      <button id="toggle-sidebar" class="icon-btn" aria-label="Recolher painel">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="stats">
      <div class="stat"><strong data-count="museums">0</strong><span>museus</span></div>
      <div class="stat"><strong data-count="countries">0</strong><span>países</span></div>
      <div class="stat"><strong data-count="species">0</strong><span>dinos</span></div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Busque um dinossauro, museu ou cidade…" autocomplete="off">
    </div>

    <div class="filter-group">
      <span class="filter-label">Dinossauros populares</span>
      <div id="dino-chips" class="chips"></div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Região</span>
      <div id="region-chips" class="chips"></div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Para brasileiros</span>
      <div id="visa-chips" class="chips"></div>
    </div>

    <div class="list-head">
      <span id="result-count"></span>
      <label class="toggle"><input type="checkbox" id="only-legendary"><span></span> Só lendários</label>
    </div>
    <ul id="museum-list" class="museum-list"></ul>
  </aside>

  <button id="open-sidebar" class="fab glass" aria-label="Abrir painel">🦖</button>

  <!-- Painel de detalhes -->
  <section id="detail" class="glass" aria-live="polite" hidden>
    <button id="close-detail" class="icon-btn close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="detail-content"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/visas.js"></script>
  <script src="data/museums.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
